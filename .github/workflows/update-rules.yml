name: Update Microsoft Store OpenClash Rules

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'   # 强制 actions 在 Node.js 24 上运行
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run generator script
        env:
          MS_ENDPOINTS_URL: https://endpoints.office.com/endpoints/worldwide
          TARGET_IP: ${{ secrets.TARGET_IP }}
          OUT_PATH: generated/openclash_rules.txt
        run: |
          python3 scripts/ms_endpoints_to_openclash.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/openclash_rules.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update OpenClash rules (auto) [skip ci]"
          git push origin HEAD:main
